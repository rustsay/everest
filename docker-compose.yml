name: ege-checker

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ege_checker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - ocr_models:/root/.paddleocr
      - speech_audio:/var/cache/everest-speech
    env_file:
      - .env
    environment:
      - UPLOADS_DIR=/app/uploads
      - SPEECH_CACHE_DIR=/var/cache/everest-speech
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/ege_checker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  ocr_models:
  speech_audio:
