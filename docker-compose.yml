name: ege-checker

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ege_checker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    # The API is reached through Nginx, which supplies the HTTPS scheme.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    volumes:
      - uploads:/app/uploads
      - ocr_models:/root/.paddleocr
      - speech_audio:/var/cache/everest-speech
    env_file:
      - .env
    environment:
      - UPLOADS_DIR=/app/uploads
      - SPEECH_CACHE_DIR=/var/cache/everest-speech
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/ege_checker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: https
    ports:
      - "80:80"
      - "443:443"
      - "3000:80"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - acme_webroot:/var/www/certbot:ro
    environment:
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      HTTPS_IP: ${HTTPS_IP:-144.31.194.150}
    depends_on:
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v5.4.0
    entrypoint: ["/bin/sh", "/opt/everest/certbot.sh"]
    environment:
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      HTTPS_IP: ${HTTPS_IP:-144.31.194.150}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - ./deploy/certbot.sh:/opt/everest/certbot.sh:ro
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
    depends_on:
      - frontend
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pgdata:
  uploads:
  ocr_models:
  speech_audio:
  letsencrypt:
  acme_webroot:
